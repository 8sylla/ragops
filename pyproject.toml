[project]
name = "ragops"
version = "0.1.0"
description = "Assistant documentaire sur les fiches Service-Public.gouv.fr, construit pour la production : Databricks, Kubernetes, évaluation en CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "N'faly Sylla" }]
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ragops-eval = "ragops.evaluate:main"
ragops-index = "ragops.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
